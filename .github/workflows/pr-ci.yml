name: PR CI

on:
  pull_request:
    branches:
      - main
      - release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Fast checks
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Repair Electron runtime
        run: npm run repair:runtime

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Gateway tests
        run: cargo test --workspace

      - name: Build gateway bundle
        run: bun run build:gateway

      - name: Verify gateway bundle
        run: bun run verify:gateway-bundle

      - name: Production build
        run: bun run build
