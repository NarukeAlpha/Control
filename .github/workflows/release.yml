name: Release

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build ${{ matrix.name }} release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            electron_builder_target: --mac
            artifact_name: control-macos
            artifact_paths: |
              release/**/*.dmg
              release/**/*.zip
          - name: Windows
            os: windows-latest
            electron_builder_target: --win
            artifact_name: control-windows
            artifact_paths: |
              release/**/*.exe
              release/**/*.zip
          - name: Linux
            os: ubuntu-latest
            electron_builder_target: --linux
            artifact_name: control-linux
            artifact_paths: |
              release/**/*.AppImage
              release/**/*.tar.gz
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Repair Electron runtime
        run: npm run repair:runtime

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Gateway tests
        run: cargo test --workspace

      - name: Build gateway bundle
        run: bun run build:gateway

      - name: Verify gateway bundle
        run: bun run verify:gateway-bundle

      - name: Build app
        run: bun run build

      - name: Package app artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder ${{ matrix.electron_builder_target }} --publish never --config.directories.output=release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists. Bump package.json before releasing."
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create and push release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}" "${GITHUB_SHA}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Control ${{ steps.version.outputs.tag }}
          body: |
            Automated Control release from `${{ github.sha }}`.

            Artifacts are unsigned until platform signing and notarization are configured.
          files: |
            release-artifacts/**/*
          fail_on_unmatched_files: true
